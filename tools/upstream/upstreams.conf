# Upstream registry for tools/upstream/sync.sh. One block per upstream; shell syntax, sourced.
# After a sync, update UPSTREAM.md and bump SYNCED here in the same commit.

# --- Offline DAoC: our direct parent. Bots, quests and server fixes come from here. ---
offlinedaoc_URL=https://github.com/shadowofze/OfflineDAoC
offlinedaoc_SYNCED=ab4df02          # v0.37 / v0.37b / v0.37c (same commit)
# "upstream-path-prefix:our-path" pairs, longest prefix wins. The bots map is the point of the
# Bots module: an upstream bot update lands in src/Bots and nowhere else.
offlinedaoc_MAP=(
  "source/server/GameServer/bots:src/Bots"
  "source/server/GameServer:src/GameServer"
  "source/server/CoreServer:src/CoreServer"
  "source/server/CoreBase:src/CoreBase"
  "source/server/CoreDatabase:src/CoreDatabase"
  "source/server/Pathing:src/Pathing"
  "source/server/sharedModules:src/sharedModules"
  "source/server/Tests:src/Tests"
)
# Never imported: client, launcher, release tooling, Windows patchers, docs.
# Not mapped = not imported. Our-only folders (Admin.Host, DaocAdmin, Admin.Protocol,
# WorldBuilder) have no upstream counterpart and are never touched.

# --- OpenDAoC-Core: the grandparent. Framework only; no sync has been done. ---
# Offline DAoC forked it with no recorded fork point, ~722 core files differ, so there is no
# SYNCED sha yet. `sync.sh opendaoc report <sha>` shows the folder map. To port a fix, diff the
# two trees yourself (see docs/UPSTREAM-SYNC.md), port by hand,
# and record each port in UPSTREAM.md ("upstream <sha> -> our commit <sha>: why").
opendaoc_URL=https://github.com/OpenDAoC/OpenDAoC-Core
opendaoc_SYNCED=
opendaoc_MAP=(
  "GameServer/bots:src/Bots"        # OpenDAoC has no bots; kept so a report never maps into core
  "GameServer:src/GameServer"
  "CoreBase:src/CoreBase"
  "CoreDatabase:src/CoreDatabase"
  "CoreServer:src/CoreServer"
  "Pathing:src/Pathing"
  "Tests:src/Tests"
)
